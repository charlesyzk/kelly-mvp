[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kelly-mvp"
version = "0.5.0"
description = "Six-model rolling Kelly research validation framework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "openpyxl>=3.1",
]

[project.scripts]
kelly-mvp = "kelly_mvp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kelly_mvp = ["web_static/*"]
